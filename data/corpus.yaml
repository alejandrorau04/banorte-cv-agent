  # ---------------- SITUACIÓN PROFESIONAL ACTUAL ----------------
  # Declaraciones de intención y disponibilidad aportadas y aprobadas por el
  # titular del CV el 2026-08-22. No proceden del documento: son información
  # que un reclutador necesita y que el CV no contiene. Ver ADR-010.
  #
  # NO se incluye expectativa salarial: el endpoint es publico y el repositorio
  # abierto. Se responde con la politica, no con una cifra.

  - id: intent.disponibilidad
    type: intent
    tags: [disponibilidad, cdmx, reubicacion, hibrido, mudanza, incorporacion, viajar]
    es: "Alejandro está disponible para trabajar en Ciudad de México, incluyendo modalidad híbrida y la reubicación que el puesto requiera. Su disponibilidad de incorporación es inmediata."
    en: "Alejandro is available to work in Mexico City, including hybrid arrangements and any relocation the role requires. He is available to start immediately."

  - id: intent.objetivo
    type: intent
    tags: [objetivo, busca, proximo, rol, crecimiento, carrera, motivacion, futuro]
    es: "Busca incorporarse a una organización de gran escala donde la ingeniería de inteligencia artificial tenga impacto real en el negocio y en los usuarios. Tras diez años construyendo soluciones de extremo a extremo y liderando equipos técnicos, le interesa un entorno con exigencia técnica alta, procesos maduros y problemas de volumen —seguridad, trazabilidad y cumplimiento— que no aparecen en proyectos pequeños. Su prioridad es el crecimiento profesional e intelectual a largo plazo, especializándose en IA generativa aplicada a producto dentro de un equipo del que pueda aprender y al que pueda aportar."
    en: "He is looking to join a large-scale organization where AI engineering has real impact on the business and its users. After ten years building end-to-end solutions and leading technical teams, he is drawn to an environment with high technical demands, mature processes, and problems of scale — security, traceability, and compliance — that do not arise in smaller projects. His priority is long-term professional and intellectual growth, specializing in generative AI applied to product, within a team he can learn from and contribute to."

  - id: intent.motivacion_ia
    type: intent
    tags: [motivacion, ia, inteligencia-artificial, por-que, interes, generativa]
    es: "Su interés por la inteligencia artificial viene de haberla llevado a producción, no de la teoría: construyó una plataforma de agentes de llamadas con IA sobre Retell AI y Twilio para comunicación multicanal, un robot digital de captación para desarrollos inmobiliarios de Vinte, y flujos de calificación y seguimiento automático de leads. Le atrae que la IA generativa permite resolver problemas que antes requerían intervención humana constante, y le interesa especialmente el trabajo de hacerla fiable: control de alucinaciones, trazabilidad de las respuestas y operación en entornos exigentes."
    en: "His interest in AI comes from taking it to production rather than from theory: he built an AI call agent platform on Retell AI and Twilio for multichannel communication, a digital lead-acquisition robot for Vinte's real estate developments, and automated lead qualification and follow-up workflows. He is drawn to how generative AI solves problems that previously required constant human intervention, and is particularly interested in making it reliable: hallucination control, response traceability, and operation in demanding environments."

  - id: intent.motivacion_financiero
    type: intent
    tags: [motivacion, financiero, banca, banco, sector, por-que, banorte]
    es: "El sector financiero le interesa porque es donde los requisitos que más valora dejan de ser opcionales: seguridad, trazabilidad, auditabilidad y disponibilidad. Su experiencia previa incluye sistemas críticos de proceso en entornos corporativos —solicitudes de crédito de clientes, pagos anticipados y automatización contable en SAP con reportes a dirección—, donde un error tiene consecuencias reales. Le motiva aplicar IA generativa en ese contexto, donde una respuesta debe poder justificarse y no solo sonar convincente."
    en: "He is drawn to the financial sector because it is where the requirements he values most stop being optional: security, traceability, auditability, and availability. His prior experience includes process-critical corporate systems — client credit requests, advance payments, and SAP accounting automation with reporting to management — where an error has real consequences. He is motivated to apply generative AI in that context, where an answer must be justifiable and not merely plausible."

  - id: intent.salario
    type: intent
    tags: [salario, sueldo, expectativa, remuneracion, compensacion, cuanto, gana]
    es: "La expectativa salarial es algo que Alejandro prefiere tratar directamente en el proceso de selección, considerando el alcance del rol y el paquete completo."
    en: "Salary expectations are something Alejandro prefers to discuss directly during the selection process, taking into account the scope of the role and the full compensation package."
