  # ---------------- PERFIL ----------------
  - id: profile.headline
    type: profile
    tags: [perfil, titulo, rol]
    es: "Alejandro Rau Lázaro es Full Stack Developer, Especialista Móvil iOS y Android, y Líder de Desarrollo. Reside en Playa del Carmen, Quintana Roo, México."
    en: "Alejandro Rau Lázaro is a Full Stack Developer, iOS and Android Mobile Specialist, and Development Lead. He is based in Playa del Carmen, Quintana Roo, Mexico."

  - id: profile.summary
    type: profile
    tags: [perfil, resumen, experiencia, años]
    es: "Ingeniero en Sistemas con más de 10 años de experiencia en desarrollo full stack, aplicaciones móviles nativas iOS y Android, y liderazgo de equipos técnicos. Especialista en arquitectura de soluciones cloud sobre AWS, plataformas SaaS, CRM a medida y sistemas de comunicación con inteligencia artificial."
    en: "Systems Engineer with over 10 years of experience in full stack development, native iOS and Android mobile applications, and technical team leadership. Specialist in AWS cloud solution architecture, SaaS platforms, custom CRM systems, and AI-powered communication systems."

  - id: profile.impact
    type: profile
    tags: [logros, impacto, rpa, ia]
    es: "Ha construido desde cero aplicaciones móviles con React Native y diseño Glass UI, plataformas de agentes de llamadas con IA (Retell AI/Twilio), dashboards ejecutivos y CRM a medida. Ha liderado implementaciones que automatizaron procesos con RPA e IA, redujeron costos de infraestructura y optimizaron tiempos críticos de operación hasta en un 50%."
    en: "He has built from scratch mobile apps with React Native and Glass UI design, AI call agent platforms (Retell AI/Twilio), executive dashboards, and custom CRMs. He has led implementations that automated processes with RPA and AI, reduced infrastructure costs, and optimized critical operation times by up to 50%."

