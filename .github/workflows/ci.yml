# Pipeline CI/CD del agente de CV.
#
#   push a main  ->  calidad  ->  imagen  ->  despliegue  ->  verificacion
#
# Principios:
#   * Nada se despliega sin pasar la puerta de calidad.
#   * La imagen se etiqueta con el SHA del commit: cada revision desplegada es
#     trazable hasta el codigo exacto y revertir es reactivar la anterior.
#   * Los tests no requieren red ni credenciales, de modo que cualquiera puede
#     ejecutar este pipeline en un fork.
#   * El despliegue se verifica: un pipeline que no comprueba el resultado solo
#     confirma que el comando no fallo, no que el servicio funcione.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # permite desplegar a mano una revision concreta

concurrency:
  # Evita que dos despliegues simultaneos se pisen.
  group: ${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/cv-agent
  APP: cv-agent
  GRUPO: rg-cv-agent

jobs:
  # ---------------------------------------------------------------- calidad --
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Tests (sin red, sin credenciales)
        run: pytest -q

      - name: Conformidad con el OpenAPI oficial
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from app.api.openresponses import build_response
          req = json.load(open("docs/contract/openapi.json"))[
              "components"]["schemas"]["ResponseResource"]["required"]
          faltan = [k for k in req if k not in build_response({}, None)]
          print(f"campos obligatorios: {len(req)} | faltantes: {faltan or 'ninguno'}")
          sys.exit(1 if faltan else 0)
          PY

      - name: Integridad del corpus y ausencia de PII
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from app.core.corpus import load_facts
          f = load_facts()
          print(f"corpus valido: {len(f)} hechos, sin datos de contacto")
          PY

      - name: Cobertura del índice de embeddings
        env:
          # Un indice parcial deja hechos invisibles y desactiva la redundancia.
          # Que eso pase debe ser una DECISION explicita, no el estado por
          # defecto: se marca esta variable mientras dure la incidencia y se
          # retira al reconstruir. Ver ADR-011.
          PERMITIR_INDICE_PARCIAL: ${{ vars.PERMITIR_INDICE_PARCIAL }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from app.core.corpus import load_facts
          from app.core.retrieval import HybridRetriever

          # Se usa EXACTAMENTE el predicado que aplica el servidor en runtime.
          # Antes se comparaban cardinalidades aqui y conjuntos de claves alli:
          # un indice con claves obsoletas pasaba el filtro y el contenedor no
          # arrancaba, despues de que CI lo declarase completo.
          r = HybridRetriever.from_index(load_facts())
          completos, parciales = r.indexed_models, r.partial_models
          for m in completos:
              print(f"  {m}: completo")
          for m, n in parciales.items():
              print(f"::warning::{m} tiene el índice INCOMPLETO (faltan {n} vectores); "
                    f"no se usará hasta reconstruirlo con scripts/build_index.py")
          print(f"modelos utilizables: {len(completos)}")

          if not completos:
              sys.exit("ERROR: ningún modelo tiene el índice completo")
          if parciales and os.getenv("PERMITIR_INDICE_PARCIAL", "").lower() != "true":
              sys.exit("ERROR: hay modelos con el índice incompleto. Reconstruir, o "
                       "declarar la excepción con la variable PERMITIR_INDICE_PARCIAL")
          PY

  # ----------------------------------------------------------------- imagen --
  imagen:
    name: Construir y publicar
    needs: calidad
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------- despliegue --
  despliegue:
    name: Desplegar en Azure
    needs: imagen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publicar nueva revisión
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              -n ${{ env.APP }} -g ${{ env.GRUPO }} \
              --image ${{ env.IMAGEN }}:${{ github.sha }} \
              -o none
            echo "FQDN=$(az containerapp show -n ${{ env.APP }} -g ${{ env.GRUPO }} \
              --query properties.configuration.ingress.fqdn -o tsv)" >> $GITHUB_ENV

      - name: Verificar el despliegue
        env:
          PERMITIR_INDICE_PARCIAL: ${{ vars.PERMITIR_INDICE_PARCIAL }}
        run: |
          echo "esperando a https://$FQDN/health"
          for i in $(seq 1 40); do
            if curl -sf "https://$FQDN/health" -o /tmp/h.json; then
              cat /tmp/h.json | python -m json.tool
              python - <<'PY'
          import json, os, sys
          h = json.load(open("/tmp/h.json"))

          # Se distingue entre NO SERVIR y SERVIR DEGRADADO. Bloquear el
          # despliegue por una degradacion que no impide operar detiene cambios
          # no relacionados; ignorarla la vuelve invisible. Lo primero falla,
          # lo segundo avisa.
          fallos = []
          if h.get("status") != "ok":     fallos.append("status != ok")
          if not h.get("vectors_loaded"): fallos.append("indice de embeddings ausente")
          if h.get("facts", 0) < 50:      fallos.append(f"solo {h.get('facts')} hechos")
          if not h.get("embed_models"): fallos.append("ningun modelo de embedding utilizable")
          # La redundancia solo puede faltar si alguien lo declaro; si no, falla.
          if h.get("embed_models_incompletos") and \
             os.getenv("PERMITIR_INDICE_PARCIAL", "").lower() != "true":
              fallos.append("redundancia de embeddings incompleta sin excepcion declarada")

          parciales = h.get("embed_models_incompletos") or {}
          if parciales:
              detalle = ", ".join(f"{m} (faltan {n})" for m, n in parciales.items())
              print(f"::warning::redundancia reducida -- indice incompleto en {detalle}. "
                    f"El servicio opera con {len(h.get('embed_models', []))} modelo(s). "
                    f"Reconstruir con scripts/build_index.py cuando la cuota se restablezca")

          print("estado:", "OK" if not fallos else f"FALLOS {fallos}")
          sys.exit(1 if fallos else 0)
          PY
              exit $?
            fi
            sleep 5
          done
          echo "el servicio no respondió a /health"; exit 1

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Imagen | \`${{ env.IMAGEN }}:${{ github.sha }}\` |"
            echo "| Endpoint | https://$FQDN |"
            echo "| Resultado | ${{ job.status }} |"
          } >> $GITHUB_STEP_SUMMARY
