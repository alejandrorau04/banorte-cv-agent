# Publicacion de la presentacion en GitHub Pages.
#
# Deliberadamente SEPARADA del pipeline del agente: la presentacion y el
# servicio tienen criticidad distinta y no deben compartir dominio de fallo.
# Un problema aqui no puede afectar al endpoint desplegado en Azure, y no
# consume recursos de la suscripcion.

name: Presentación

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Nunca se cancela un despliegue en curso: `deploy-pages` crea el despliegue
  # via API y lo sondea; abortarlo a medias lo deja atascado y el siguiente
  # falla. Mismo criterio que ci.yml.
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # `tsc --noEmit` sin `-b` no sigue las referencias de proyecto: comprobaba
      # CERO archivos y siempre pasaba. `npm run build` ya ejecuta `tsc -b`.
      - run: npm run lint
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
